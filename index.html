<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Hanout - Catalogue</title>
  <!-- Tailwind CSS (version minifiée statique, production) -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/dist/tailwind.min.css" rel="stylesheet" />
  <!-- React + ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Cloudinary Widget -->
  <script src="https://widget.cloudinary.com/v2.0/global/all.js" type="text/javascript"></script>

  <style>
    /* Scrollbar personnalisée */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 8px; }

    /* Animation fade-in pour les modales */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-animate {
      animation: fadeIn 0.2s ease-out;
    }

    /* Spinner */
    .spinner {
      border: 3px solid rgba(51, 65, 85, 0.4);
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="apple-touch-icon" href="icon.png" />
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect, useRef } = React;

  function App() {
    // ---- CONSTANTES INJECTEES ----
    var VENDOR = "{{VENDOR}}";
    var PASSWORD_HASH = "{{PASSWORD_HASH}}";
    var isPlaceholder = VENDOR.startsWith("{{");

    var params = new URLSearchParams(window.location.search);
    var repoName = window.location.pathname.split('/')[1] || '';
    var deducedVendor = repoName.startsWith('hanout-') ? repoName.replace('hanout-', '') : null;
    var vendeur = params.get("vendeur") || deducedVendor || localStorage.getItem("vendeur_name") || VENDOR;

    // ---- ETATS ----
    var [sogUser, setSogUser] = useState(null);
    var [isReady, setIsReady] = useState(false);
    var [fgtToken, setFgtToken] = useState('');
    var [isTokenSaved, setIsTokenSaved] = useState(false);
    var [isLoading, setIsLoading] = useState(true);
    var [data, setData] = useState(null);
    var [editableData, setEditableData] = useState(null);
    var [isAdmin, setIsAdmin] = useState(false);
    var [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
    var [showPasswordModal, setShowPasswordModal] = useState(false);
    var [adminPassword, setAdminPassword] = useState("");
    var [msg, setMsg] = useState({ text: "", type: "" });
    var [isCommitting, setIsCommitting] = useState(false);
    var [modal, setModal] = useState({ open: false, type: "", item: null, creating: false });
    var [formData, setFormData] = useState({});
    var [cart, setCart] = useState([]);
    var [showCart, setShowCart] = useState(false);
    var [expandedImage, setExpandedImage] = useState(null);
    var [selectedCategoryId, setSelectedCategoryId] = useState(null);
    var [searchQuery, setSearchQuery] = useState("");
    var [order, setOrder] = useState({ name: "", address: "", phone: "", comments: "" });

    // ---- SCHEMA ----
    var schema = {
      categories: {
        label: "Catégories",
        icon: "📂",
        fields: [
          { key: "icon", label: "Icône", type: "text", maxLength: 2, default: "📁" },
          { key: "name", label: "Nom", type: "text", required: true },
        ]
      },
      products: {
        label: "Produits",
        icon: "📦",
        fields: [
          { key: "name", label: "Nom", type: "text", required: true },
          { key: "price", label: "Prix", type: "number", step: "0.01", required: true },
          { key: "image", label: "URL image", type: "text" },
          { key: "categoryId", label: "Catégorie", type: "select", options: "categories" },
          { key: "stock", label: "Stock", type: "number" },
        ]
      }
    };

    // ---- UTF-8 ----
    var utf8ToBase64 = function(str) {
      try {
        var utf8Bytes = new TextEncoder().encode(str);
        var binaryString = String.fromCharCode.apply(null, utf8Bytes);
        return btoa(binaryString);
      } catch (e) {
        return btoa(unescape(encodeURIComponent(str)));
      }
    };
    var base64ToUtf8 = function(str) {
      try {
        var binaryString = atob(str);
        var bytes = new Uint8Array(binaryString.length);
        for (var i = 0; i < binaryString.length; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }
        return new TextDecoder('utf-8').decode(bytes);
      } catch (e) {
        return decodeURIComponent(escape(atob(str)));
      }
    };

    // ---- CLOUDINARY ----
    var openCloudinaryWidget = function(fieldKey) {
      if (!window.cloudinary) {
        alert("Le widget Cloudinary n'est pas chargé.");
        return;
      }
      var widget = window.cloudinary.createUploadWidget(
        {
          cloudName: 'h91be5lz',
          uploadPreset: 'hanout_upload',
          sources: ['local', 'url', 'camera'],
          multiple: false,
          maxFiles: 1,
          folder: 'hanout_products',
          resourceType: 'image',
          clientAllowedFormats: ['jpg', 'jpeg', 'png', 'gif', 'webp'],
          maxImageFileSize: 5000000,
          maxImageWidth: 800,
          maxImageHeight: 800,
          styles: {
            palette: {
              window: '#1e293b', sourceBg: '#0f172a', windowBorder: '#334155',
              tabIcon: '#2563eb', inactiveTabIcon: '#94a3b8', menuIcons: '#2563eb',
              link: '#2563eb', action: '#2563eb', inProgress: '#2563eb',
              complete: '#22c55e', error: '#ef4444',
              textDark: '#f1f5f9', textLight: '#94a3b8'
            }
          }
        },
        function(error, result) {
          if (error) {
            console.error("Erreur Cloudinary:", error);
            alert("Erreur lors de l'upload de l'image.");
            return;
          }
          if (result.event === 'success') {
            setFormData(function(prev) { return { ...prev, [fieldKey]: result.info.secure_url }; });
            setMsg({ text: "Image téléchargée avec succès !", type: "success" });
          }
        }
      );
      widget.open();
    };

    // ---- ECOUTE SOG ----
    useEffect(function() {
      var handleMessage = function(event) {
        if (event.data.type === 'SOG_AUTH') {
          setSogUser(event.data.payload.user);
        }
      };
      window.addEventListener('message', handleMessage);
      window.parent.postMessage({ type: 'SOG_READY' }, '*');
      setIsReady(true);
      return function() {
        window.removeEventListener('message', handleMessage);
      };
    }, []);

    // ---- CHARGEMENT FGT ----
    useEffect(function() {
      var stored = localStorage.getItem('fgt_token_' + repoName);
      if (stored) {
        setFgtToken(stored);
        setIsTokenSaved(true);
      }
    }, []);

    // ---- TOKEN FGT ----
    var MASTER_TOKEN = null;
    function getToken() {
      if (MASTER_TOKEN) return MASTER_TOKEN;
      var tokenKey = "fgt_token_" + repoName;
      var token = localStorage.getItem(tokenKey);
      if (!token) {
        token = prompt("Entrez le token pour " + repoName + " :");
        if (token) {
          localStorage.setItem(tokenKey, token);
          setFgtToken(token);
          setIsTokenSaved(true);
        } else {
          alert("Token requis.");
          return null;
        }
      }
      MASTER_TOKEN = token;
      return token;
    }
    var saveFgtToken = function() {
      if (fgtToken.trim()) {
        localStorage.setItem('fgt_token_' + repoName, fgtToken.trim());
        setIsTokenSaved(true);
        setMsg({ text: "Token FGT sauvegardé !", type: "success" });
        MASTER_TOKEN = fgtToken.trim();
      } else {
        setMsg({ text: "Entrez un token valide.", type: "error" });
      }
    };

    // ---- CHARGEMENT DONNEES ----
    useEffect(function() {
      var load = async function() {
        if (!vendeur || isPlaceholder) { setIsLoading(false); return; }
        try {
          var url = "https://api.github.com/repos/mekeirish/" + repoName + "/contents/don.json";
          var res = await fetch(url);
          if (res.status === 404) {
            var defaultData = {
              settings: {
                title: "Boutique de " + vendeur,
                currency: "DZD",
                showStock: true,
                ntfyTopic: vendeur + "_commandes"
              },
              categories: [],
              products: [],
            };
            setData(defaultData);
            setEditableData(defaultData);
          } else if (res.ok) {
            var d = await res.json();
            var decoded = base64ToUtf8(d.content);
            try {
              var parsed = JSON.parse(decoded);
              setData(parsed);
              setEditableData(parsed);
            } catch (parseErr) {
              setMsg({ text: "Erreur: le fichier don.json est mal formé.", type: "error" });
              setData(null);
              setEditableData(null);
            }
          }
        } catch (err) {
          setMsg({ text: "Erreur: " + err.message, type: "error" });
        }
        setIsLoading(false);
      };
      load();
    }, []);

    // ---- SAUVEGARDE ----
    var saveFile = async function(content) {
      var token = getToken();
      if (!token) throw new Error("Token requis.");
      var url = "https://api.github.com/repos/mekeirish/" + repoName + "/contents/don.json";
      var encoded = utf8ToBase64(JSON.stringify(content, null, 2));
      var sha = null;
      try {
        var getRes = await fetch(url, { headers: { Authorization: "token " + token } });
        if (getRes.ok) { var d = await getRes.json(); sha = d.sha; }
      } catch (e) {}
      var payload = { message: "Mise à jour", content: encoded, branch: "main" };
      if (sha) payload.sha = sha;
      var putRes = await fetch(url, {
        method: "PUT",
        headers: { Authorization: "token " + token, "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!putRes.ok) { var err = await putRes.json(); throw new Error("GitHub " + putRes.status + ": " + err.message); }
      return putRes.json();
    };
    var saveEditableData = async function() {
      await saveFile(editableData);
      setData(editableData);
    };

    // ---- AUTH ADMIN ----
    var sha256 = async function(message) {
      var msgBuffer = new TextEncoder().encode(message);
      var hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      return Array.from(new Uint8Array(hashBuffer)).map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
    };
    var handleAdminLogin = async function() {
      var hash = await sha256(adminPassword);
      if (hash === PASSWORD_HASH) {
        setIsAdminAuthenticated(true);
        setShowPasswordModal(false);
        setAdminPassword("");
        setMsg({ text: "Accès admin autorisé", type: "success" });
        setIsAdmin(true);
      } else {
        setMsg({ text: "Mot de passe incorrect", type: "error" });
      }
    };
    var handleAdminClick = function() {
      if (isAdminAuthenticated) { setIsAdmin(!isAdmin); } else { setShowPasswordModal(true); }
    };

    // ---- CRUD CATEGORIES ----
    var openCatModal = function(cat) {
      if (cat === undefined) cat = null;
      setModal({ open: true, type: "category", item: cat, creating: !cat });
      var defaultVals = {};
      schema.categories.fields.forEach(function(f) {
        defaultVals[f.key] = cat?.[f.key] || f.default || "";
      });
      setFormData(defaultVals);
    };
    var saveCategory = function() {
      var maxId = 0;
      editableData.categories.forEach(function(c) { if (c.id > maxId) maxId = c.id; });
      var newCat = { id: modal.creating ? maxId + 1 : modal.item.id };
      schema.categories.fields.forEach(function(f) { newCat[f.key] = formData[f.key] || f.default; });
      if (modal.creating) { editableData.categories.push(newCat); } else {
        var idx = editableData.categories.findIndex(function(c) { return c.id === modal.item.id; });
        if (idx > -1) editableData.categories[idx] = newCat;
      }
      setEditableData({ ...editableData });
      closeModal();
      setMsg({ text: "Catégorie sauvegardée", type: "info" });
    };
    var deleteCategory = function(id) {
      if (!confirm("Supprimer cette catégorie ?")) return;
      setEditableData({
        ...editableData,
        categories: editableData.categories.filter(function(c) { return c.id !== id; }),
        products: editableData.products.filter(function(p) { return p.categoryId !== id; }),
      });
      setMsg({ text: "Catégorie supprimée", type: "info" });
    };

    // ---- CRUD PRODUITS ----
    var openProdModal = function(prod) {
      if (prod === undefined) prod = null;
      setModal({ open: true, type: "product", item: prod, creating: !prod });
      var defaultVals = {};
      schema.products.fields.forEach(function(f) {
        if (f.key === "categoryId") {
          var defaultCategory = selectedCategoryId || (editableData.categories[0] ? editableData.categories[0].id : "");
          defaultVals[f.key] = prod?.[f.key] || defaultCategory || f.default || "";
        } else {
          defaultVals[f.key] = prod?.[f.key] || f.default || "";
        }
      });
      setFormData(defaultVals);
    };
    var saveProduct = function() {
      if (!formData.categoryId && editableData.categories.length > 0) {
        formData.categoryId = editableData.categories[0].id;
      }
      var maxId = 0;
      editableData.products.forEach(function(p) { if (p.id > maxId) maxId = p.id; });
      var newProd = { id: modal.creating ? maxId + 1 : modal.item.id };
      schema.products.fields.forEach(function(f) {
        var val = formData[f.key] !== undefined ? formData[f.key] : f.default;
        newProd[f.key] = f.type === "number" ? parseFloat(val) || 0 : val;
      });
      if (modal.creating) { editableData.products.push(newProd); } else {
        var idx = editableData.products.findIndex(function(p) { return p.id === modal.item.id; });
        if (idx > -1) editableData.products[idx] = newProd;
      }
      setEditableData({ ...editableData });
      closeModal();
      setMsg({ text: "Produit sauvegardé", type: "info" });
    };
    var deleteProduct = function(id) {
      if (!confirm("Supprimer ce produit ?")) return;
      setEditableData({ ...editableData, products: editableData.products.filter(function(p) { return p.id !== id; }) });
      setMsg({ text: "Produit supprimé", type: "info" });
    };

    // ---- COMMIT ----
    var handleCommit = async function() {
      setIsCommitting(true);
      try {
        await saveEditableData();
        setMsg({ text: "Données sauvegardées !", type: "success" });
      } catch (err) {
        setMsg({ text: "Échec: " + err.message, type: "error" });
      }
      setIsCommitting(false);
    };

    // ---- PANIER ----
    var addToCart = function(product) {
      if (product.stock <= 0) { alert("Rupture de stock"); return; }
      if (!sogUser) { alert("Connectez-vous à SOG."); return; }
      
      setCart(function(prev) {
        var existing = prev.find(function(i) { return i.id === product.id; });
        if (existing) {
          if (existing.quantity >= product.stock) { alert("Stock insuffisant"); return prev; }
          return prev.map(function(i) {
            return i.id === product.id ? { ...i, quantity: i.quantity + 1 } : i;
          });
        }
        return [...prev, { ...product, quantity: 1 }];
      });
    };
    
    var updateQty = function(id, delta) {
      setCart(function(prev) {
        var item = prev.find(function(i) { return i.id === id; });
        if (!item) return prev;
        var newQty = item.quantity + delta;
        if (newQty <= 0) return prev.filter(function(i) { return i.id !== id; });
        if (newQty > item.stock) { alert("Stock insuffisant"); return prev; }
        return prev.map(function(i) {
          return i.id === id ? { ...i, quantity: newQty } : i;
        });
      });
    };
    
    var removeFromCart = function(id) {
      setCart(function(prev) { return prev.filter(function(i) { return i.id !== id; }); });
    };
    
    var getTotal = function() {
      return cart.reduce(function(sum, i) { return sum + i.price * i.quantity; }, 0).toFixed(2);
    };

    // ---- ENVOI COMMANDE A SOG ----
    var sendOrderToSOG = function(orderData) {
      window.parent.postMessage({
        type: 'SOG_ORDER',
        payload: {
          vendor: vendeur,
          items: cart.map(function(i) { return { name: i.name, quantity: i.quantity, price: i.price }; }),
          total: parseFloat(getTotal()),
          currency: editableData?.settings?.currency || "DZD",
          customerName: orderData.name,
          customerPhone: orderData.phone,
          customerAddress: orderData.address,
          comments: orderData.comments || ""
        }
      }, '*');
    };

    // ---- CHECKOUT ----
    var checkout = async function() {
      if (cart.length === 0) { alert("Panier vide"); return; }
      if (!sogUser) { alert("Connectez-vous à SOG."); return; }
      if (!order.name.trim() || !order.address.trim() || !order.phone.trim()) {
        alert("Champs obligatoires.");
        return;
      }
      sendOrderToSOG(order);
      var topic = editableData?.settings?.ntfyTopic;
      if (topic) {
        var currencySymbol = editableData?.settings?.currency || "€";
        var total = getTotal();
        var message = "RÉCAPITULATIF\n\n";
        message += "Client : " + order.name + "\n";
        message += "Adresse : " + order.address + "\n";
        message += "Tél : " + order.phone + "\n";
        message += "Remarque : " + (order.comments || "Aucun") + "\n\n";
        message += "----------------------------------------\n\n";
        message += "Articles commandés :\n";
        cart.forEach(function(i) {
          message += "  " + i.name + " x" + i.quantity + " = " + (i.price * i.quantity).toFixed(2) + " " + currencySymbol + "\n";
        });
        message += "\n----------------------------------------\n\n";
        message += "TOTAL : " + total + " " + currencySymbol;
        await fetch("https://ntfy.sh/" + topic, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ topic: topic, title: "NOUVELLE COMMANDE", message: message, priority: 5 }),
        }).catch(console.error);
      }
      setCart([]);
      setOrder({ name: "", address: "", phone: "", comments: "" });
      setShowCart(false);
      alert("Commande validée !");
    };

    // ---- UTILITAIRES ----
    var getCategoryName = function(id) {
      var cat = data?.categories?.find(function(c) { return c.id === id; });
      return cat ? cat.name : "Sans catégorie";
    };
    var getCategoryIcon = function(id) {
      var cat = data?.categories?.find(function(c) { return c.id === id; });
      return cat ? cat.icon : "📁";
    };
    var hasPending = function(item, type) {
      if (!data) return false;
      var orig = type === "product" ? data.products.find(function(p) { return p.id === item.id; }) : data.categories.find(function(c) { return c.id === item.id; });
      var draft = type === "product" ? editableData.products.find(function(p) { return p.id === item.id; }) : editableData.categories.find(function(c) { return c.id === item.id; });
      return JSON.stringify(orig) !== JSON.stringify(draft);
    };
    var getFiltered = function() {
      if (!editableData) return [];
      var filtered = editableData.products || [];
      if (selectedCategoryId) {
        filtered = filtered.filter(function(p) { return p.categoryId === selectedCategoryId; });
      }
      if (searchQuery.trim()) {
        var q = searchQuery.toLowerCase().trim();
        filtered = filtered.filter(function(p) {
          return p.name.toLowerCase().includes(q) || p.price.toString().includes(q);
        });
      }
      return filtered;
    };
    var closeModal = function() {
      setModal({ open: false, type: "", item: null, creating: false });
    };

    // ---- RENDER FIELD ----
    var renderField = function(field) {
      var val = formData[field.key] || "";
      var onChange = function(e) { setFormData({ ...formData, [field.key]: e.target.value }); };
      
      if (field.type === "select") {
        var options = field.options === "categories" ? (editableData?.categories || []) : [];
        return (
          <div key={field.key} className="flex flex-col gap-1 w-full">
            <label className="text-sm text-slate-300">{field.label}</label>
            <select value={val} onChange={onChange} className="bg-slate-900/50 backdrop-blur-sm border border-white/10 w-full px-4 py-2 rounded-xl text-white focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 outline-none transition-all">
              <option value="">Choisir...</option>
              {options.map(function(opt) {
                return <option key={opt.id} value={opt.id}>{opt.icon} {opt.name}</option>;
              })}
            </select>
          </div>
        );
      }
      
      if (field.type === "textarea") {
        return (
          <div key={field.key} className="flex flex-col gap-1 w-full">
             <label className="text-sm text-slate-300">{field.label}</label>
             <textarea value={val} onChange={onChange} placeholder={field.label} rows={field.rows || 3} className="bg-slate-900/50 backdrop-blur-sm border border-white/10 w-full px-4 py-2 rounded-xl text-white focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 outline-none transition-all resize-y" />
          </div>
        );
      }
      
      if (field.key === 'image') {
        return (
          <div key={field.key} className="flex flex-col gap-1 w-full">
            <label className="text-sm text-slate-300">{field.label}</label>
            <div className="flex gap-2 items-center">
              <input type="text" step={field.step} maxLength={field.maxLength} value={val} onChange={onChange} placeholder={field.label} className="bg-slate-900/50 backdrop-blur-sm border border-white/10 flex-1 px-4 py-2 rounded-xl text-white focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 outline-none transition-all" />
              <button onClick={function() { openCloudinaryWidget(field.key); }} className="bg-blue-500/20 hover:bg-blue-500/30 border border-blue-500/30 text-blue-100 backdrop-blur-md transition-all shadow-sm px-3 py-2 rounded-xl text-sm font-medium" type="button" title="Upload">📷</button>
              {val && (
                <div className="flex-shrink-0 w-12 h-12 rounded-xl overflow-hidden bg-slate-800/50 border border-white/10">
                  <img src={val} alt="aperçu" className="w-full h-full object-cover" onError={function(e) { e.target.style.display = 'none'; }} />
                </div>
              )}
            </div>
          </div>
        );
      }
      
      return (
        <div key={field.key} className="flex flex-col gap-1 w-full">
          <label className="text-sm text-slate-300">{field.label}</label>
          <input type={field.type || "text"} step={field.step} maxLength={field.maxLength} value={val} onChange={onChange} placeholder={field.label} className="bg-slate-900/50 backdrop-blur-sm border border-white/10 w-full px-4 py-2 rounded-xl text-white focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 outline-none transition-all" />
        </div>
      );
    };

    // ---- RENDU PRINCIPAL ----
    if (isLoading) {
      return (
        <div className="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
          <div className="spinner"></div>
          <p className="text-slate-400 mt-4 text-sm drop-shadow-md">Chargement du catalogue...</p>
        </div>
      );
    }
    
    if (!vendeur || isPlaceholder) {
      return (
        <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
          <div className="bg-slate-900/80 backdrop-blur-xl border border-white/10 shadow-2xl max-w-sm w-full p-6 rounded-2xl text-center">
            <h2 className="text-red-400 font-bold text-lg">Configuration requise</h2>
            <p className="text-sm text-slate-400 mt-2">{isPlaceholder ? "Template non configuré." : "Vendeur incorrect."}</p>
            <p className="text-xs text-slate-500 mt-1">Utilisez le forkeur.</p>
          </div>
        </div>
      );
    }

    var settings = editableData?.settings || {};
    var currency = settings.currency || "€";
    var cartCount = cart.reduce(function(s, i) { return s + i.quantity; }, 0);

    return (
      <div className="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-slate-100">

        {/* ---- HEADER GLASS ---- */}
        <header className="bg-slate-900/50 backdrop-blur-lg border-b border-white/10 sticky top-0 z-30 px-4 py-3">
          <div className="max-w-7xl mx-auto flex justify-between items-center">
            <h1 className="text-xl font-bold text-white truncate max-w-[50%] drop-shadow-md" title={settings.title || "Catalogue"}>
              {settings.title || "Catalogue"}
            </h1>
            <div className="flex items-center gap-2">
              <button onClick={handleAdminClick} className="bg-slate-700/30 hover:bg-slate-700/50 border border-white/10 text-slate-200 backdrop-blur-md transition-all px-4 py-2 rounded-xl text-sm font-medium">
                Admin
              </button>
              <button onClick={function() { setShowCart(true); }} className="bg-blue-500/20 hover:bg-blue-500/30 border border-blue-500/30 text-blue-100 backdrop-blur-md transition-all shadow-sm relative px-4 py-2 rounded-xl text-sm font-medium">
                🛒 Panier
                {cartCount > 0 && (
                  <span className="bg-red-500/80 backdrop-blur-sm border border-red-400/50 shadow-lg absolute -top-2 -right-2 text-white text-xs font-bold rounded-full h-5 min-w-[1.25rem] flex items-center justify-center px-1">
                    {cartCount}
                  </span>
                )}
              </button>
            </div>
          </div>
        </header>

        <main className="max-w-7xl mx-auto px-4 py-4">
          {/* ---- MESSAGES ---- */}
          {!sogUser && isReady && (
            <div className="backdrop-blur-md mb-4 p-3 bg-yellow-900/20 border border-yellow-700/30 rounded-xl text-yellow-200 text-sm flex items-center gap-2">
              <span>🔒 Mode Invité.</span>
              <a href="#" onClick={function(e) { e.preventDefault(); window.parent.postMessage({ type: 'SOG_LOGIN_REQUEST' }, '*'); }} className="text-yellow-400 hover:underline font-medium">Connectez-vous</a>
              <span>pour commander.</span>
            </div>
          )}
          {msg.text && (
            <div className={'backdrop-blur-md mb-4 p-3 rounded-xl border text-sm ' + (msg.type === 'success' ? 'bg-emerald-900/20 border-emerald-700/30 text-emerald-200' : msg.type === 'error' ? 'bg-red-900/20 border-red-700/30 text-red-200' : 'bg-yellow-900/20 border-yellow-700/30 text-yellow-200')}>
              {msg.text}
            </div>
          )}

          {/* ---- ADMIN ---- */}
          {isAdmin && isAdminAuthenticated ? (
            <div>
              <h2 className="text-2xl font-bold text-white mb-4 drop-shadow-md">🛠 PANEL ADMIN</h2>

              <div className="bg-slate-800/30 backdrop-blur-md border border-white/10 shadow-lg p-4 rounded-2xl mb-4">
                <h3 className="font-semibold text-white mb-3">⚙️ Configuration Générale</h3>
                <div className="flex flex-col gap-3">
                  <input type="text" value={editableData?.settings?.title || ""} onChange={function(e) { setEditableData({ ...editableData, settings: { ...editableData.settings, title: e.target.value } }); }} placeholder="Titre de la boutique" className="bg-slate-900/50 backdrop-blur-sm border border-white/10 w-full px-4 py-2 rounded-xl text-white focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 outline-none transition-all" />
                  <input type="text" value={editableData?.settings?.currency || ""} onChange={function(e) { setEditableData({ ...editableData, settings: { ...editableData.settings, currency: e.target.value } }); }} placeholder="Devise (ex: DZD, €)" className="bg-slate-900/50 backdrop-blur-sm border border-white/10 w-full px-4 py-2 rounded-xl text-white focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 outline-none transition-all" />
                  <input type="text" value={editableData?.settings?.ntfyTopic || ""} onChange={function(e) { setEditableData({ ...editableData, settings: { ...editableData.settings, ntfyTopic: e.target.value } }); }} placeholder="Topic Notifications (Ntfy)" className="bg-slate-900/50 backdrop-blur-sm border border-white/10 w-full px-4 py-2 rounded-xl text-white focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 outline-none transition-all" />
                </div>
              </div>

              <div className="bg-slate-800/30 backdrop-blur-md border border-white/10 shadow-lg p-4 rounded-2xl mb-4">
                <h3 className="font-semibold text-white mb-3">🔑 Jeton GitHub (FGT)</h3>
                <div className="flex gap-2 items-center">
                  <input type="password" value={fgtToken} onChange={function(e) { setFgtToken(e.target.value); setIsTokenSaved(false); }} placeholder="Collez votre token ici..." className="bg-slate-900/50 backdrop-blur-sm border border-white/10 flex-1 px-4 py-2 rounded-xl text-white focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 outline-none transition-all" />
                  <button onClick={saveFgtToken} className="bg-blue-500/20 hover:bg-blue-500/30 border border-blue-500/30 text-blue-100 backdrop-blur-md transition-all shadow-sm px-4 py-2 rounded-xl text-sm font-medium">{isTokenSaved ? '✅ Sauvé' : '💾 Sauver'}</button>
                </div>
              </div>

              <div className="bg-slate-800/30 backdrop-blur-md border border-white/10 shadow-lg p-4 rounded-2xl mb-4">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="font-semibold text-white">📂 Catégories</h3>
                  <button onClick={function() { openCatModal(null); }} className="bg-blue-500/20 hover:bg-blue-500/30 border border-blue-500/30 text-blue-100 backdrop-blur-md transition-all shadow-sm px-4 py-2 rounded-xl text-sm font-medium">+ Ajouter</button>
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                  {(editableData?.categories || []).map(function(c) {
                    return (
                      <div key={c.id} className="flex items-center gap-2 p-2 rounded-xl bg-white/5 backdrop-blur-sm border border-white/10">
                        <span className="text-lg">{c.icon}</span>
                        <span className="text-sm truncate flex-1 text-white">{c.name}</span>
                        <button onClick={function() { openCatModal(c); }} className="text-blue-400 hover:text-blue-300 text-sm p-1">✎</button>
                        <button onClick={function() { deleteCategory(c.id); }} className="text-red-400 hover:text-red-300 text-sm p-1">✕</button>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="bg-slate-800/30 backdrop-blur-md border border-white/10 shadow-lg p-4 rounded-2xl mb-4">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="font-semibold text-white">📦 Produits</h3>
                  <button onClick={function() { openProdModal(null); }} className="bg-blue-500/20 hover:bg-blue-500/30 border border-blue-500/30 text-blue-100 backdrop-blur-md transition-all shadow-sm px-4 py-2 rounded-xl text-sm font-medium">+ Ajouter</button>
                </div>
                <div className="flex flex-col gap-2 max-h-96 overflow-y-auto pr-1">
                  {(editableData?.products || []).map(function(p) {
                    return (
                      <div key={p.id} className="flex items-center gap-3 p-2 rounded-xl bg-white/5 backdrop-blur-sm border border-white/10">
                        <img src={p.image} alt={p.name} className="w-10 h-10 object-cover rounded-xl" onError={function(e) { e.target.src = "https://via.placeholder.com/50"; }} />
                        <div className="flex-1 min-w-0">
                          <p className="text-sm font-medium text-white truncate">{p.name}</p>
                          <p className="text-xs text-slate-400">{p.price}{currency} · {getCategoryName(p.categoryId)}</p>
                        </div>
                        <a href={window.location.origin + window.location.pathname} target="_blank" rel="noopener noreferrer" className="text-blue-400 hover:text-blue-300 text-sm font-medium">Voir</a>
                        <button onClick={function() { openProdModal(p); }} className="text-blue-400 hover:text-blue-300 text-sm p-1">✎</button>
                        <button onClick={function() { deleteProduct(p.id); }} className="text-red-400 hover:text-red-300 text-sm p-1">✕</button>
                      </div>
                    );
                  })}
                </div>
              </div>

              <button onClick={handleCommit} disabled={isCommitting} className="bg-blue-500/20 hover:bg-blue-500/30 border border-blue-500/30 text-blue-100 backdrop-blur-md transition-all shadow-sm w-full py-3 rounded-2xl font-semibold disabled:opacity-50 text-lg">
                {isCommitting ? '⏳ Sauvegarde en cours...' : '💾 Pousser les modifications (Commit)'}
              </button>
            </div>
          ) : (
            // ---- CATALOGUE PUBLIC ----
            <div>
              <input type="text" value={searchQuery} onChange={function(e) { setSearchQuery(e.target.value); }} placeholder="Rechercher un produit..." className="bg-slate-900/50 backdrop-blur-sm border border-white/10 w-full px-4 py-3 rounded-xl text-white placeholder-slate-400 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 outline-none transition-all mb-4" />

              <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
                <button onClick={function() { setSelectedCategoryId(null); }} className={'px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all backdrop-blur-md border ' + (!selectedCategoryId ? 'bg-blue-500/30 border-blue-500/40 text-white shadow-lg' : 'bg-slate-800/40 border-white/10 text-slate-300 hover:bg-slate-700/50')}>
                  Tout voir
                </button>
                {(editableData?.categories || []).map(function(c) {
                  return (
                    <button key={c.id} onClick={function() { setSelectedCategoryId(c.id); }} className={'px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all backdrop-blur-md border ' + (selectedCategoryId === c.id ? 'bg-blue-500/30 border-blue-500/40 text-white shadow-lg' : 'bg-slate-800/40 border-white/10 text-slate-300 hover:bg-slate-700/50')}>
                      <span>{c.icon}</span> {c.name}
                    </button>
                  );
                })}
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 mt-4">
                {getFiltered().map(function(p) {
                  var isOutOfStock = p.stock <= 0;
                  return (
                    <div key={p.id} className="bg-slate-800/30 backdrop-blur-md border border-white/10 shadow-lg hover:-translate-y-1 hover:shadow-2xl hover:border-white/20 rounded-xl overflow-hidden transition-all duration-300">
                      <div className="aspect-square bg-slate-900/50 overflow-hidden" onClick={function() { setExpandedImage(p.image); }}>
                        <img src={p.image} alt={p.name} className="w-full h-full object-cover hover:scale-110 transition-transform duration-500" loading="lazy" onError={function(e) { e.target.src = "https://via.placeholder.com/300"; }} />
                      </div>
                      <div className="p-3 flex flex-col gap-1">
                        <span className="text-xs text-slate-400 truncate">{getCategoryIcon(p.categoryId)} {getCategoryName(p.categoryId)}</span>
                        <h3 className="text-sm font-semibold text-white line-clamp-2 drop-shadow-md">{p.name}</h3>
                        <p className="text-base font-bold text-blue-400">{p.price}{currency}</p>
                        <button onClick={function() { addToCart(p); }} disabled={isOutOfStock || !sogUser} className={'mt-2 w-full py-2 rounded-xl text-sm font-medium transition-all ' + (isOutOfStock ? 'bg-slate-700/30 text-slate-400 cursor-not-allowed border border-white/5' : 'bg-blue-500/20 hover:bg-blue-500/30 border border-blue-500/30 text-blue-100 backdrop-blur-md shadow-sm')}>
                          {isOutOfStock ? 'Rupture' : '🛒 Ajouter'}
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>

              {getFiltered().length === 0 && (
                <div className="text-center py-12 text-slate-400 drop-shadow-md">
                  {searchQuery ? "Aucun résultat trouvé." : "Ce catalogue est vide."}
                </div>
              )}
            </div>
          )}
        </main>

        {/* =========================================
            MODALES (GLASS)
            ========================================= */}

        {/* MODALE ADMIN */}
        {showPasswordModal && (
          <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50 modal-animate" onClick={function() { setShowPasswordModal(false); }}>
            <div className="bg-slate-900/80 backdrop-blur-xl border border-white/10 shadow-2xl rounded-2xl p-6 max-w-md w-full" onClick={function(e) { e.stopPropagation(); }}>
              <div className="flex justify-between items-start mb-4">
                <h3 className="text-xl font-bold text-white drop-shadow-md">🔐 Accès restreint</h3>
                <button className="text-slate-400 hover:text-white text-3xl leading-none" onClick={function() { setShowPasswordModal(false); }}>×</button>
              </div>
              <p className="text-sm text-slate-400 mb-3">Veuillez saisir le mot de passe administrateur :</p>
              <input type="password" value={adminPassword} onChange={function(e) { setAdminPassword(e.target.value); }} placeholder="Mot de passe..." className="bg-slate-900/50 backdrop-blur-sm border border-white/10 w-full px-4 py-2 rounded-xl text-white focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 outline-none transition-all mb-4" onKeyDown={function(e) { if (e.key === "Enter") handleAdminLogin(); }} />
              <div className="flex gap-3">
                <button onClick={handleAdminLogin} className="bg-blue-500/20 hover:bg-blue-500/30 border border-blue-500/30 text-blue-100 backdrop-blur-md transition-all shadow-sm flex-1 py-2 rounded-xl font-medium">Déverrouiller</button>
                <button onClick={function() { setShowPasswordModal(false); }} className="bg-slate-700/30 hover:bg-slate-700/50 border border-white/10 text-slate-200 backdrop-blur-md transition-all flex-1 py-2 rounded-xl font-medium">Annuler</button>
              </div>
            </div>
          </div>
        )}

        {/* MODALE IMAGE */}
        {expandedImage && (
          <div className="fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-50 modal-animate" onClick={function() { setExpandedImage(null); }}>
            <div className="relative max-w-4xl w-full h-full flex items-center justify-center" onClick={function(e) { e.stopPropagation(); }}>
              <button className="absolute top-4 right-4 text-white text-4xl hover:text-slate-300 transition-colors" onClick={function() { setExpandedImage(null); }}>×</button>
              <img src={expandedImage} alt="Zoom" className="max-h-full max-w-full object-contain rounded-xl" />
            </div>
          </div>
        )}

        {/* MODALE PANIER */}
        {showCart && (
          <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50 modal-animate" onClick={function() { setShowCart(false); }}>
            <div className="bg-slate-900/80 backdrop-blur-xl border border-white/10 shadow-2xl rounded-2xl p-6 max-w-lg w-full max-h-[90vh] overflow-y-auto" onClick={function(e) { e.stopPropagation(); }}>
              <div className="flex justify-between items-start mb-4">
                <h3 className="text-xl font-bold text-white drop-shadow-md">🛒 Mon Panier</h3>
                <button className="text-slate-400 hover:text-white text-3xl leading-none" onClick={function() { setShowCart(false); }}>×</button>
              </div>

              {cart.length === 0 ? (
                <div className="text-center py-8 text-slate-400 drop-shadow-md">Votre panier est vide.</div>
              ) : (
                <div className="flex flex-col gap-4">
                  <div className="flex flex-col gap-2 max-h-60 overflow-y-auto">
                    {cart.map(function(i) {
                      return (
                        <div key={i.id} className="flex items-center justify-between gap-3 p-3 rounded-xl bg-white/5 backdrop-blur-sm border border-white/10">
                          <div className="flex-1 min-w-0">
                            <p className="text-sm font-medium text-white truncate drop-shadow-md">{i.name}</p>
                            <p className="text-xs text-blue-400 font-bold">{i.price}{currency}</p>
                          </div>
                          <div className="flex items-center gap-1">
                            <button onClick={function() { updateQty(i.id, -1); }} className="w-8 h-8 flex items-center justify-center bg-white/10 hover:bg-white/20 rounded-xl text-white text-lg font-bold transition-all">−</button>
                            <span className="w-8 text-center font-bold text-white">{i.quantity}</span>
                            <button onClick={function() { updateQty(i.id, 1); }} className="w-8 h-8 flex items-center justify-center bg-white/10 hover:bg-white/20 rounded-xl text-white text-lg font-bold transition-all">+</button>
                            <button onClick={function() { removeFromCart(i.id); }} className="w-8 h-8 flex items-center justify-center bg-red-500/20 hover:bg-red-500/30 rounded-xl text-red-400 font-bold transition-all">✕</button>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  <div className="flex justify-between items-center py-3 border-t border-white/10 text-lg font-bold">
                    <span className="drop-shadow-md">Total</span>
                    <span className="text-blue-400">{getTotal()}{currency}</span>
                  </div>

                  <div className="flex flex-col gap-3">
                    <input type="text" value={order.name} onChange={function(e) { setOrder({ ...order, name: e.target.value }); }} placeholder="Votre nom complet *" className="bg-slate-900/50 backdrop-blur-sm border border-white/10 w-full px-4 py-2 rounded-xl text-white placeholder-slate-400 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 outline-none transition-all" />
                    <input type="text" value={order.address} onChange={function(e) { setOrder({ ...order, address: e.target.value }); }} placeholder="Adresse de livraison *" className="bg-slate-900/50 backdrop-blur-sm border border-white/10 w-full px-4 py-2 rounded-xl text-white placeholder-slate-400 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 outline-none transition-all" />
                    <input type="tel" value={order.phone} onChange={function(e) { setOrder({ ...order, phone: e.target.value }); }} placeholder="Numéro de téléphone *" className="bg-slate-900/50 backdrop-blur-sm border border-white/10 w-full px-4 py-2 rounded-xl text-white placeholder-slate-400 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 outline-none transition-all" />
                    <textarea value={order.comments} onChange={function(e) { setOrder({ ...order, comments: e.target.value }); }} placeholder="Note ou instruction spéciale..." rows="2" className="bg-slate-900/50 backdrop-blur-sm border border-white/10 w-full px-4 py-2 rounded-xl text-white placeholder-slate-400 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 outline-none transition-all resize-y" />
                  </div>

                  <button onClick={checkout} disabled={!sogUser} className="bg-blue-500/20 hover:bg-blue-500/30 border border-blue-500/30 text-blue-100 backdrop-blur-md transition-all shadow-sm w-full py-3 rounded-xl font-semibold disabled:opacity-50 text-lg">
                    ✅ Valider ma commande
                  </button>
                  {!sogUser && <p className="text-center text-xs text-yellow-500 drop-shadow-md">Connexion SOG requise pour commander.</p>}
                </div>
              )}
            </div>
          </div>
        )}

        {/* MODALE EDITION / CREATION */}
        {modal.open && (
          <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50 modal-animate" onClick={closeModal}>
            <div className="bg-slate-900/80 backdrop-blur-xl border border-white/10 shadow-2xl rounded-2xl p-6 max-w-md w-full max-h-[90vh] overflow-y-auto" onClick={function(e) { e.stopPropagation(); }}>
              <div className="flex justify-between items-start mb-4">
                <h3 className="text-xl font-bold text-white drop-shadow-md">
                  {modal.creating ? '✨ Ajouter ' : '✏️ Modifier '}
                  {modal.type === 'category' ? 'une catégorie' : 'un produit'}
                </h3>
                <button className="text-slate-400 hover:text-white text-3xl leading-none" onClick={closeModal}>×</button>
              </div>

              <div className="flex flex-col gap-3">
                {modal.type === "category"
                  ? schema.categories.fields.map(function(f) { return renderField(f); })
                  : schema.products.fields.map(function(f) {
                      if (f.key === "categoryId") return renderField({ ...f, options: "categories" });
                      return renderField(f);
                    })
                }
              </div>

              <div className="flex gap-3 mt-5">
                <button onClick={modal.type === "category" ? saveCategory : saveProduct} className="bg-blue-500/20 hover:bg-blue-500/30 border border-blue-500/30 text-blue-100 backdrop-blur-md transition-all shadow-sm flex-1 py-2 rounded-xl font-medium">
                  {modal.creating ? 'Créer' : 'Enregistrer'}
                </button>
                <button onClick={closeModal} className="bg-slate-700/30 hover:bg-slate-700/50 border border-white/10 text-slate-200 backdrop-blur-md transition-all flex-1 py-2 rounded-xl font-medium">Annuler</button>
              </div>
            </div>
          </div>
        )}

      </div>
    );
  }

  var container = document.getElementById('root');
  var root = ReactDOM.createRoot(container);
  root.render(React.createElement(App, null));
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('./sw.js');
    });
  }
</script>
</body>
</html>
